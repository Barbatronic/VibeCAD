# Publication de VibeCAD sur GitHub Pages.
# Lancement MANUEL uniquement : onglet « Actions » du dépôt → « Publier sur GitHub Pages » → « Run workflow ».
# Aucune publication automatique (ni push, ni pull request, ni tag, ni calendrier).
name: Publier sur GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installation reproductible
        run: npm ci
      - name: Vérifications (types, architecture, tests)
        run: npm run check
      - name: Construction de l'application
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
